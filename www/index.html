<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1524"><title>MecTools Pro</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ff;background:#09111f}*{box-sizing:border-box}body{margin:0}header{padding:22px 18px;background:linear-gradient(135deg,#112e4d,#0b1627);border-bottom:1px solid #25405d}h1{font-size:25px;margin:0}small,.muted{color:#9fb5cf}.tag{color:#5ce0cc;font-size:12px;letter-spacing:2px;font-weight:700}main{max-width:740px;margin:auto;padding:16px 16px 60px}nav{display:flex;gap:8px;overflow:auto;padding:0 0 16px}button{cursor:pointer;border:1px solid #315271;border-radius:12px;padding:11px 14px;background:#17304a;color:#fff;font-weight:650}button.active{background:#00a995;color:#031b22;border-color:#00a995}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:#12253b;border:1px solid #26425f;padding:17px;border-radius:15px;text-align:left;min-height:100px}.tile b{display:block;margin:7px 0}.tile span{font-size:12px;color:#a3b8ce}.panel{background:#11243a;border:1px solid #294663;border-radius:17px;padding:18px;margin:12px 0}.panel h2{font-size:21px;margin:0 0 14px}.field{margin:13px 0}label{display:block;color:#b8cbe0;font-size:13px;margin-bottom:7px}input,select{background:#081a2b;border:1px solid #3a5873;color:white;width:100%;padding:13px;border-radius:10px;font-size:17px}output,.result{display:block;padding:16px;background:#073c41;color:#76f5d5;border-radius:12px;margin-top:16px;font-size:21px;font-weight:750;overflow-wrap:anywhere}.note{font-size:12px;color:#b4c6d8;line-height:1.6}.back{margin-bottom:12px}.hidden{display:none}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 7px;border-bottom:1px solid #34506a;text-align:left}svg{width:100%;height:auto;background:#0a1c30;border-radius:12px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.panel{overflow:hidden}input:focus,select:focus{outline:2px solid #54cbbd}footer{color:#829ab5;text-align:center;font-size:12px;padding:25px}
</style></head><body><header><div class="tag">SANMAPPS • FERRAMENTAS INDUSTRIAIS</div><h1>⚙ MecTools Pro</h1><small>Cálculos, instrumentação e manutenção • Offline</small></header><main><section id="home"><div class="panel"><b>Qual ferramenta você precisa?</b><p class="muted">Selecione um módulo para calcular e consultar referências técnicas.</p><input id="search" placeholder="Buscar pressão, rosca, súbito..." oninput="filterTools()"></div><div id="tiles" class="grid"></div></section><section id="tool" class="hidden"><button class="back" onclick="home()">← Todas as ferramentas</button><div id="content"></div></section><footer>Resultados auxiliares • Confirme especificações e limites com o fabricante.</footer></main>
<script>
const modules=[
['alignment','Alinhamento CENTAC','2 relógios reversos, calços, motor','⊕'],['discharge','Vazão de descarga','CENTAC: medição, blow-off, inlet, corrente','◈'],['microns','Mícrons ↔ mils','Conversão direta µm e mils','⇄'],['pressure','Pressão','PSI, bar, kPa, MPa','◉'],['inch','Polegadas','Frações, mm, µm','▤'],['vibration','Vibração','mm/s RMS, mils, µm','〰'],['flow','Vazão em tubos','Diâmetro e velocidade','◈'],['torque','Torque','N·m e lbf·ft','↻'],['loop','Instrumentação 4–20 mA','Sinal e escala','⌁'],['dial','Relógio comparador','Milésimos de polegada','◴'],['bore','Súbito','Diâmetro, ovalização','◎'],['surge','Surge: causas e diagnóstico','Sintomas, pontos de coleta e mapa OEM','⌁'],['bolts','Parafusos métricos M2–M48','Passo ISO, broca, rosca fina e conversão','⚙'],['threads','Roscas NPT e BSP','Tabelas e passo','≋'],['instruments','Instrumentos','Paquímetro, micrômetro e mais','▥'],['rpm','RPM e frequência','Hz, RPM, CPM','⟳'],['thermal','Dilatação térmica','Expansão linear','↔']
];
const $=id=>document.getElementById(id);
function filterTools(){let q=$('search').value.toLowerCase();$('tiles').innerHTML=modules.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<button class="tile" onclick="openTool('${x[0]}')"><div style="font-size:24px;color:#6ce3d1">${x[3]}</div><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}
function home(){$('tool').classList.add('hidden');$('home').classList.remove('hidden')}
function field(id,label,value,type='number'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type==='number'?'text':type}" inputmode="${type==='number'?'decimal':'text'}" value="${value}" oninput="calc()"></div>`}
function sel(id,label,opts){return `<div class="field"><label>${label}</label><select id="${id}" onchange="calc()">${opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`}
const out=()=>'<output id="answer">Preencha os dados.</output>';
const n=id=>{const el=$(id);if(!el||el.value.trim()==='')return NaN;const value=el.value.trim().replace(',','.');return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(value)?Number(value):NaN};
const fmt=(v,d=4)=>Number.isFinite(v)?v.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
function frac(raw){
 const s=String(raw).trim().replace(',', '.').replace(/\s*-\s*/g,' ').replace(/\s+/g,' ');
 if(!s)return NaN;
 let m=s.match(/^([+-]?\d+)\s+(\d+)\/(\d+)$/);
 if(m){const den=Number(m[3]);return den>0?Number(m[1])+(Number(m[1])<0?-1:1)*Number(m[2])/den:NaN;}
 m=s.match(/^([+-]?\d+)\/(\d+)$/);
 if(m){const den=Number(m[2]);return den>0?Number(m[1])/den:NaN;}
 return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN;
}
function gcd(a,b){while(b){const t=b;b=a%b;a=t}return a}
function nearestFraction(inches,den=128){if(!Number.isFinite(inches))return '—';const sign=inches<0?'-':'';let num=Math.round(Math.abs(inches)*den),whole=Math.floor(num/den),rem=num%den;if(!rem)return sign+whole;let div=gcd(rem,den);return sign+(whole?whole+' ':'')+(rem/div)+'/'+(den/div)}
function inchReference(){let html='<div style="overflow-x:auto"><table><tr><th>Fração (in)</th><th>Decimal (in)</th><th>Milímetros</th></tr>';for(let i=1;i<=64;i++){const x=i/64;html+=`<tr><td>${nearestFraction(x,64)}</td><td>${fmt(x,6)}</td><td>${fmt(x*25.4,6)}</td></tr>`}return html+'</table></div>'}

const metricBolts=[
[2,0.4,[0.25]],[2.5,0.45,[0.35]],[3,0.5,[0.35]],[3.5,0.6,[]],[4,0.7,[0.5]],[5,0.8,[0.5]],[6,1,[0.75,0.5]],[7,1,[]],[8,1.25,[1,0.75]],[10,1.5,[1.25,1]],[12,1.75,[1.5,1.25]],[14,2,[1.5]],[16,2,[1.5,1]],[18,2.5,[2,1.5]],[20,2.5,[2,1.5]],[22,2.5,[2,1.5]],[24,3,[2,1.5]],[27,3,[2,1.5]],[30,3.5,[3,2]],[33,3.5,[3,2]],[36,4,[3,2]],[39,4,[3,2]],[42,4.5,[3,2]],[45,4.5,[3,2]],[48,5,[3,2]]
];
function boltTable(){return `<div style="overflow-x:auto"><table><thead><tr><th>Rosca</th><th>Passo grosso (mm)</th><th>Broca aproximada (mm)</th><th>Passos finos usuais (mm)</th></tr></thead><tbody>${metricBolts.map(([d,p,f])=>`<tr><td>M${fmt(d,2)}</td><td>${fmt(p,2)}</td><td>${fmt(d-p,2)}</td><td>${f.length?f.map(x=>fmt(x,2)).join(' / '):'Consultar norma'}</td></tr>`).join('')}</tbody></table></div>`}
function renderMetricBolt(){const d=Number($('bolt-size').value);const data=metricBolts.find(x=>x[0]===d);if(!data)return;const [diam,coarse,fine]=data;const options=[coarse,...fine];$('bolt-pitch').innerHTML=options.map((p,i)=>`<option value="${p}">${fmt(p,2)} mm (${i===0?'passo grosso':'passo fino'})</option>`).join('');calcMetricBolt()}
function calcMetricBolt(){const d=Number($('bolt-size').value),p=Number($('bolt-pitch').value);if(!(d>0&&p>0&&p<d)){$('bolt-result').textContent='Selecione um diâmetro e passo válidos.';return}const drill=d-p;const tpi=25.4/p;$('bolt-result').innerHTML=`M${fmt(d,2)} × ${fmt(p,2)}<br>Diâmetro nominal: ${fmt(d,2)} mm (${fmt(d/25.4,5)} in)<br>Passo: ${fmt(p,3)} mm (${fmt(tpi,3)} fios por polegada, equivalente matemático)<br>Broca de pré-furo aproximada: ${fmt(drill,2)} mm<br><span style="font-size:13px">Pré-furo estimado pela regra D − P, para rosca interna cortada; verificar tabela de usinagem, tolerância e material.</span>`}

let current='';
function openTool(id){current=id;$('home').classList.add('hidden');$('tool').classList.remove('hidden');let name=modules.find(x=>x[0]===id)[1],body='';
switch(id){
case 'alignment':body=`<p class="note"><b>Montagem conforme esquema CENTAC fornecido:</b> dois relógios reversos. Relógio inferior com suporte no lado compressor, apalpando cubo do motor; relógio superior com suporte no lado motor, apalpando cubo do compressor. Confirme fisicamente a posição dos planos e a orientação dos apalpadores antes de utilizar qualquer resultado.</p>
<svg viewBox="0 0 350 180" role="img" aria-label="Esquema didático do motor à esquerda e compressor à direita com relógio inferior à esquerda e superior à direita"><rect x="8" y="63" width="100" height="53" rx="7" fill="#174663" stroke="#75a8c5"/><text x="31" y="86" fill="white" font-size="12">MOTOR</text><text x="23" y="101" fill="#afcde0" font-size="10">MÓVEL</text><rect x="239" y="63" width="103" height="53" rx="7" fill="#174663" stroke="#75a8c5"/><text x="249" y="86" fill="white" font-size="11">COMPRESSOR</text><text x="263" y="101" fill="#afcde0" font-size="10">FIXO</text><path d="M108 90 H239" stroke="#65dfc7" stroke-width="6"/><rect x="155" y="73" width="37" height="34" rx="4" fill="#8296aa"/><path d="M96 128 H210 V40 H195" fill="none" stroke="#e4b864" stroke-width="3"/><path d="M250 43 H142 V138 H158" fill="none" stroke="#78bdf3" stroke-width="3"/><circle cx="195" cy="40" r="12" fill="#12253b" stroke="#e4b864" stroke-width="3"/><circle cx="158" cy="138" r="12" fill="#12253b" stroke="#78bdf3" stroke-width="3"/><text x="211" y="28" fill="#e4b864" font-size="10">Superior (B)</text><text x="15" y="161" fill="#78bdf3" font-size="10">Inferior (A)</text><text x="13" y="175" fill="#afcde0" font-size="9">Esquema conceitual — não representa suporte real em escala</text></svg>
<h3>Referências de campo: onde medir</h3><table><tr><th>Referência</th><th>Onde coletar</th></tr><tr><td>Plano A — inferior</td><td>Centro da ponta do relógio inferior em contato com o cubo do motor</td></tr><tr><td>Plano B — superior</td><td>Centro da ponta do relógio superior em contato com o cubo do compressor</td></tr><tr><td>Pé próximo F1</td><td>Centro dos parafusos de fixação do motor próximos ao acoplamento</td></tr><tr><td>Pé distante F2</td><td>Centro dos parafusos de fixação do motor afastados do acoplamento</td></tr><tr><td>Distância A–B</td><td>Distância axial entre os dois planos de contato dos relógios, não entre as faces do acoplamento</td></tr><tr><td>Sag A/B</td><td>Ensaio de flexão de cada suporte com montagem representativa, seguindo procedimento OEM</td></tr></table><p class="note">Meça distâncias ao longo do eixo, com a mesma origem e sentido. Compressor normalmente fixo e motor móvel: confirme antes do cálculo. Leituras são coletadas em 12h, 3h, 6h e 9h conforme procedimento, sem alterar o zero entre posições.</p><h3>1. Distâncias axiais (mm)</h3><p class="note">Referência axial: plano A = 0; sentido positivo do motor para o compressor. Informe as coordenadas medidas no equipamento. A posição dos pés pode ser negativa.</p>
${field('ab','Plano B em relação ao plano A (mm)', '', 'text')}${field('af','Coordenada do pé do motor próximo ao acoplamento (mm)', '', 'text')}${field('ar','Coordenada do pé do motor distante do acoplamento (mm)', '', 'text')}
<h3>2. Leituras do relógio inferior — plano A</h3><p class="note">Insira os valores na unidade selecionada na etapa 5 (mm ou mils).</p>${field('at','12h (topo), unidade selecionada','','text')}${field('abottom','6h (embaixo), unidade selecionada','','text')}${field('al','9h (esquerda), unidade selecionada','','text')}${field('aright','3h (direita), unidade selecionada','','text')}
<h3>3. Leituras do relógio superior — plano B</h3><p class="note">Insira os valores na mesma unidade do relógio inferior.</p>${field('bt','12h (topo), unidade selecionada','','text')}${field('bbottom','6h (embaixo), unidade selecionada','','text')}${field('bl','9h (esquerda), unidade selecionada','','text')}${field('bright','3h (direita), unidade selecionada','','text')}
<h3>4. Correção de flexão do suporte (sag)</h3><p class="note">Insira a correção diferencial vertical (leitura 6h menos 12h) determinada no teste de sag, com sinal e na mesma unidade; não é um deslocamento de eixo.</p>
${field('saga','Sag diferencial do relógio inferior A (mesma unidade das leituras)',0)}${field('sagb','Sag diferencial do relógio superior B (mesma unidade das leituras)',0)}
<h3>5. Convenções verificadas</h3>${sel('unit','Unidade das leituras',[['mm','mm'],['mil','mils (0,001 in)']])}${sel('mapping','Relação física do relógio e eixo',[['','Selecione após confirmar em campo'],['verified','Montagem reversa e orientação confirmadas']])}${sel('polA','Sinal físico do relógio A',[['','Selecione polaridade A'],['1','Leitura diferencial positiva = posição positiva'],['-1','Leitura diferencial positiva = posição negativa']])}${sel('polB','Sinal físico do relógio B',[['','Selecione polaridade B'],['1','Leitura diferencial positiva = posição positiva'],['-1','Leitura diferencial positiva = posição negativa']])}
<p class="note">Convenção de referência: vertical positivo = acima; horizontal positivo = à direita olhando do motor para o compressor. Para relógios reversos com apalpadores em sentidos opostos, a polaridade de cada relógio pode diferir. Verifique com deslocamento controlado e procedimento OEM. Os valores são calculados por interpolação/extrapolação geométrica; não incluem crescimento térmico nem compensação de metas a quente.</p>
${out()}<button onclick="copyAlignment()">Copiar resultado</button><p class="note"><b>Protótipo de cálculo, não validado:</b> a orientação do esquema enviado não determina, por si só, o sinal das leituras. Sem confirmação de montagem, sag e geometria, não execute correções em campo. Conferir pé manco, condição térmica, tolerâncias OEM e repetir medição após qualquer ajuste.</p>`;break;
case 'microns':body=sel('unit','Sentido da conversão',[['um','Mícrons (µm) para mils'],['mil','Mils para mícrons (µm)']])+field('a','Valor',25.4)+out()+'<p class="note">1 mil = 0,001 polegada = 25,4 µm. Conversão dimensional direta. Em vibração, mantenha a mesma referência de amplitude (pico, pico a pico ou RMS).</p>';break;
case 'discharge':body=`<p class="note"><b>Diagnóstico CENTAC.</b> A abertura da inlet, blow-off e a corrente do motor NÃO permitem calcular a vazão real isoladamente. Selecione um método medido ou validado. Todos os resultados de vazão devem indicar sua base de referência.</p>
${sel('method','Como a vazão será determinada?',[['velocity','Velocidade média medida na linha de descarga'],['flowmeter','Leitura de medidor de vazão na descarga'],['mass','Vazão mássica medida'],['diagnostic','Somente diagnóstico operacional (sem vazão medida)']])}
<h3>1. Ponto de coleta e condições</h3>
${field('di','Diâmetro INTERNO da linha no ponto de medição (mm)',100)}${field('vel','Velocidade média MEDIDA na seção (m/s)', '', 'text')}${field('meter','Leitura do medidor de vazão (m³/h nas condições da linha)', '', 'text')}${field('mass','Vazão mássica medida (kg/h)', '', 'text')}
${field('ps','Pressão de SUCÇÃO absoluta (bar a)', '', 'text')}${field('ts','Temperatura de SUCÇÃO (°C)', '', 'text')}${field('pd','Pressão de DESCARGA absoluta (bar a)', '', 'text')}${field('td','Temperatura de DESCARGA (°C)', '', 'text')}
${sel('gas','Gás',[['air','Ar seco (aproximação ideal)'],['other','Outro gás — informar constante específica']])}${field('r','Constante específica do gás R (J/kg·K)',287.05)}
<h3>2. Instrumentação e válvulas (diagnóstico)</h3>
${field('inlet','Abertura da inlet / IGV (%)', '', 'text')}${field('blow','Abertura da blow-off (%)', '', 'text')}${field('amps','Corrente do motor (A)', '', 'text')}${field('volts','Tensão entre fases (V)', '', 'text')}${field('pf','Fator de potência medido (0 a 1)', '', 'text')}
<h3>3. Vazão descarregada / reciclada</h3><p class="note">Para subtrair a vazão da blow-off, informe sua vazão MÁSSICA medida (kg/h). Posição em % não equivale a vazão. Se for reciclo para sucção, identifique os limites de medição e faça balanço de massa apropriado.</p>
${field('vent','Vazão mássica da blow-off medida (kg/h)', '', 'text')}
${out()}<h3>Onde coletar cada dado?</h3><table><tr><th>Parâmetro</th><th>Ponto de coleta</th></tr><tr><td>Pressão/temperatura de sucção</td><td>Instrumentos no coletor de entrada, conforme P&ID</td></tr><tr><td>Pressão/temperatura de descarga</td><td>Instrumentos na saída, antes de ramais ou perdas relevantes</td></tr><tr><td>Vazão/velocidade</td><td>Medidor na seção definida do tubo, com perfil de escoamento adequado</td></tr><tr><td>Inlet / blow-off</td><td>Indicação de posição no painel e confirmação em campo</td></tr><tr><td>Corrente, tensão, FP</td><td>Instrumentação elétrica do motor / medidor de potência</td></tr><tr><td>Diâmetro interno</td><td>Desenho isométrico, especificação de tubo ou medição segura</td></tr></table>
<p class="note"><b>Limites:</b> fórmula de gás ideal é aproximada, especialmente com umidade e compressibilidade não ideal. m³/h reais na descarga não são Nm³/h. A vazão na descarga não é determinada por pressão, temperatura, posição de válvula e corrente sem dados adicionais. Não usar para ajustes de controle ou proteção anti-surge sem validação OEM.</p>`;break;
case 'pressure':body=field('a','Pressão',100)+sel('u','Unidade de entrada',[['psi','PSI'],['bar','bar'],['kpa','kPa'],['mpa','MPa']])+out()+'<p class="note">Conversão de unidade: informe se a pressão é manométrica (g) ou absoluta (a). Converter unidade não transforma pressão manométrica em absoluta. Para isso é necessário conhecer a pressão atmosférica local.</p>';break;
case 'inch':body=sel('inchdir','Sentido da conversão',[['in-mm','Polegadas → mm, µm e mils'],['mm-in','Milímetros → polegadas e fração'],['mil-in','Mils (0,001 in) → mm e polegadas']])+field('a','Valor (ex.: 4/5, 1/4, 1 1/2, 0,875 ou 25,4)','1/4','text')+out()+'<p class="note">Aceita frações comuns e mistas, números decimais com vírgula ou ponto. A fração equivalente de mm é aproximada ao 1/128 de polegada; a medida decimal é a referência precisa.</p><details><summary>Ver tabela de frações até 1 polegada (1/64)</summary>'+inchReference()+'</details>';break;
case 'vibration':body=field('a','Velocidade RMS (mm/s)',0.82)+field('b','Frequência da vibração (Hz)',60)+out()+'<p class="note">A conversão só é válida para vibração senoidal de uma frequência. RMS de velocidade e deslocamento pico a pico não são unidades diretamente intercambiáveis.</p>';break;
case 'flow':body=field('a','Diâmetro INTERNO (mm)',100)+field('b','Velocidade média (m/s)',10)+out()+'<p class="note">Q = A × v. Para dimensionar válvulas e vazão de gás compressível, são necessários outros parâmetros (pressões, temperatura, composição, coeficiente da válvula e condição de escoamento).</p>';break;
case 'torque':body=field('a','Torque (N·m)',100)+out();break;
case 'loop':body=field('a','Limite inferior da escala',0)+field('b','Limite superior da escala',10)+field('c','Corrente medida (mA)',12)+out();break;
case 'dial':body=field('a','Leitura em mils (0,001 polegada)',1)+out()+'<p class="note">1 mil = 0,001 in = 0,0254 mm = 25,4 µm. Observe a resolução e o sentido do relógio real.</p>';break;
case 'bore':body=field('a','Diâmetro de referência (mm)',100)+field('b','Desvio indicado com sinal (mm)',0.025)+field('c','Medida no eixo X (mm)',100.025)+field('d','Medida no eixo Y (mm)',99.99)+out()+'<p class="note">O sinal do desvio depende da convenção de ajuste do comparador. Faça a zeragem em padrão conhecido antes de medir.</p>';break;
case 'rpm':body=field('a','Frequência (Hz)',60)+out();break;
case 'thermal':body=field('a','Comprimento inicial (mm)',1000)+field('b','Variação de temperatura (°C)',50)+field('c','Coeficiente de dilatação (×10⁻⁶/°C)',12)+out();break;
case 'surge':body=`<p><b>O que é surge (bombeamento)?</b> Instabilidade aerodinâmica de compressor dinâmico quando o sistema exige uma elevação de pressão que o compressor não consegue manter de forma estável na vazão de operação. Pode causar oscilações intensas de pressão/vazão, ruídos, vibração e até reversão momentânea do fluxo.</p>
<details open><summary><b>1. Causas e situações a investigar</b></summary><ul><li>Consumo reduzido na rede ou aumento da contrapressão de descarga.</li><li>Inlet/IGV excessivamente fechada, desajuste de controle ou operação fora do envelope OEM.</li><li>Blow-off/reciclo/antisurge com resposta lenta, travada, vazamento, comando incorreto ou capacidade insuficiente.</li><li>Alteração de RPM, temperatura, pressão, composição do gás ou obstrução na sucção.</li><li>Transientes de partida/parada, mudança rápida de demanda e falhas de instrumentos ou controle.</li></ul><p class="note">Uma blow-off aberta pode ser atuação normal de proteção. A posição em % não é igual à vazão descarregada.</p></details>
<details open><summary><b>2. Onde coletar as referências</b></summary><div style="overflow-x:auto"><table><tr><th>Dado</th><th>Ponto de coleta</th><th>O que observar</th></tr><tr><td>Pressão de sucção (bar A)</td><td>Transmissor/manômetro no bocal ou coletor de entrada</td><td>Valor absoluto, quedas e oscilação</td></tr><tr><td>Temperatura de sucção (°C)</td><td>Sensor próximo à entrada</td><td>Condição de referência</td></tr><tr><td>Pressão de descarga (bar G/A)</td><td>Transmissor na descarga, identificar base</td><td>Contrapressão e oscilações</td></tr><tr><td>Temperatura de descarga (°C)</td><td>Sensor após o estágio/saída</td><td>Variação anormal</td></tr><tr><td>Vazão (kg/h, Nm³/h etc.)</td><td>Medidor calibrado e localização definida</td><td>Tendência e base de correção</td></tr><tr><td>Inlet/IGV (%)</td><td>Comando e realimentação no painel/atuador</td><td>Diferença comando × posição real</td></tr><tr><td>Blow-off/reciclo (%)</td><td>Comando e realimentação no painel/atuador</td><td>Abertura, resposta e falhas</td></tr><tr><td>Corrente (A) / potência (kW)</td><td>Instrumentação elétrica apropriada</td><td>Variações de carga; não define vazão</td></tr><tr><td>Vibração / ruído</td><td>Sensores de mancais, tendências e observação segura</td><td>Eventos coincidentes com oscilações</td></tr><tr><td>RPM e alarmes</td><td>Controlador e histórico de eventos</td><td>Transientes e atuação antisurge</td></tr></table></div></details>
<details><summary><b>3. Checklist de investigação</b></summary><div id="surge-checks"><label><input type="checkbox" style="width:auto"> Confirmar pressão e vazão nas tendências, não só leitura instantânea</label><label><input type="checkbox" style="width:auto"> Conferir sinais e calibração dos transmissores</label><label><input type="checkbox" style="width:auto"> Comparar comando e posição real da inlet/IGV</label><label><input type="checkbox" style="width:auto"> Comparar comando e posição real da blow-off/reciclo</label><label><input type="checkbox" style="width:auto"> Verificar alarmes, atuação antisurge e sequência de eventos</label><label><input type="checkbox" style="width:auto"> Investigar filtros, restrições e alterações na demanda</label><label><input type="checkbox" style="width:auto"> Comparar o ponto de operação com mapa OEM na mesma base</label><label><input type="checkbox" style="width:auto"> Confirmar procedimento operacional e limites do fabricante</label></div></details>
<h3>4. Comparação com a linha OEM (opcional)</h3><p class="note">Use SOMENTE valores de vazão corrigida obtidos no mesmo mapa OEM, velocidade/IGV e base de referência. O resultado é uma separação de vazões, NÃO a margem de surge certificada nem o ajuste do controlador antisurge.</p>`+field('a','Vazão corrigida do ponto operacional (mesma unidade OEM)','')+field('b','Vazão corrigida da linha de surge no mesmo ponto de referência','')+out()+`<p class="note"><b>Sem mapa OEM:</b> use o checklist de diagnóstico; não há como determinar a margem real de surge. Não altere limites de proteção ou válvulas com base nesta ferramenta. Consulte os manuais CENTAC do modelo específico, mapa OEM, documentação do sistema antisurge, API 617 e API 670 conforme aplicável.</p>`;break;
case 'bolts':body=`<p class="note"><b>Parafusos e roscas métricas ISO.</b> A designação M10 × 1,5 indica diâmetro nominal de 10 mm e avanço de 1,5 mm por volta (rosca de uma entrada). Roscas métricas possuem perfil de 60°. Tabela de referência para séries usuais; confirme ISO 261/262/965 e desenho técnico.</p><div class="field"><label for="bolt-size">Diâmetro nominal do parafuso</label><select id="bolt-size" onchange="renderMetricBolt()">${metricBolts.map(x=>`<option value="${x[0]}">M${fmt(x[0],2)}</option>`).join('')}</select></div><div class="field"><label for="bolt-pitch">Passo da rosca (grosso / fino)</label><select id="bolt-pitch" onchange="calcMetricBolt()"></select></div><output id="bolt-result">Selecione a medida.</output><details><summary>Ver tabela M2 a M48</summary>${boltTable()}</details><p class="note"><b>Importante:</b> tamanho da chave, diâmetro da cabeça, comprimento do parafuso, furo de passagem e torque variam conforme a norma, geometria, classe de resistência, junta e lubrificação. O valor D−P é apenas uma aproximação de pré-furo, não uma tolerância de fabricação. Nunca aplicar torque sem especificação validada.</p>`;break;
case 'threads':body=`<p class="note">Roscas de tubulação têm diâmetro externo diferente do tamanho nominal. BSPP = paralela; BSPT e NPT = cônicas. Não são intercambiáveis sem avaliação técnica.</p><table><tr><th>Nominal</th><th>NPT TPI</th><th>BSP TPI</th><th>OD NPT (mm aprox.)</th><th>OD BSP (mm aprox.)</th></tr>${[['1/8',27,28,10.29,9.73],['1/4',18,19,13.72,13.16],['3/8',18,19,17.15,16.66],['1/2',14,14,21.34,20.96],['3/4',14,14,26.67,26.44],['1',11.5,11,33.40,33.25]].map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</table><p class="note">Tabela resumida de consulta. Confirme normas ASME B1.20.1 e ISO 7 / ISO 228, tolerâncias e calibres antes da fabricação.</p>`;break;
case 'instruments':body=`<p>Guia rápido de instrumentos de medição:</p><table><tr><th>Instrumento</th><th>Aplicação / cuidado</th></tr>${[['Paquímetro','Diâmetro externo/interno, profundidade; verificar zero e resolução do nônio.'],['Micrômetro','Medições precisas; usar catraca e padrão de verificação.'],['Súbito','Diâmetros internos; zerar por anel ou micrômetro de referência.'],['Relógio comparador','Batimento radial/axial, deslocamento relativo e alinhamento.'],['Relógio apalpador','Batimento em pontos de acesso limitado.'],['Calibrador de folgas','Folgas entre superfícies; evitar força excessiva.'],['Rugosímetro','Rugosidade superficial; definir parâmetro e comprimento de avaliação.'],['Manômetro','Pressão; conferir escala e classe de exatidão.'],['Calibrador de loop','Sinal 4–20 mA; conferir alimentação e modo fonte/simulador.']].map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</table><p class="note">Para registrar medições, anote instrumento, identificação, certificado de calibração, resolução, temperatura, valor, tolerância e incerteza.</p>`;break;
}
$('content').innerHTML=`<div class="panel"><h2>${name}</h2>${body}</div>`;if(id==='bolts'){renderMetricBolt()}else{calc()}}
function copyAlignment(){if(window.alignmentSummary){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(window.alignmentSummary).catch(()=>prompt('Copie o resultado:',window.alignmentSummary))}else{prompt('Copie o resultado:',window.alignmentSummary)}}}
function calc(){let a=n('a'),b=n('b'),c=n('c'),d=n('d'),v='',ok=true;if(['threads','instruments','bolts'].includes(current))return;
switch(current){
case 'alignment':{
const ids=['ab','af','ar','at','abottom','al','aright','bt','bbottom','bl','bright','saga','sagb'];
const filled=ids.every(id=>$(id)&&$(id).value.trim()!==''), ab=n('ab'), fd=n('af'), tr=n('ar');
const verified=$('mapping').value==='verified'&&$('polA').value!==''&&$('polB').value!=='';
const unit=$('unit').value==='mil'?0.0254:1;
const pA=Number($('polA').value),pB=Number($('polB').value);
ok=filled&&verified&&ab>0&&fd!==tr&&[ab,fd,tr,...ids.map(n)].every(Number.isFinite);
if(!ok){v='Preencha todas as leituras e distâncias, confirme a montagem e selecione as polaridades físicas dos dois relógios. Sem isso, o cálculo permanece bloqueado.';window.alignmentSummary='';break;}
const va=((n('abottom')-n('at')-n('saga'))/2)*pA*unit;
const vb=((n('bbottom')-n('bt')-n('sagb'))/2)*pB*unit;
const ha=((n('aright')-n('al'))/2)*pA*unit;
const hb=((n('bright')-n('bl'))/2)*pB*unit;
const at=(x1,x2,x)=>x1+(x2-x1)*x/ab;
const vf=-at(va,vb,fd),vr=-at(va,vb,tr),hf=-at(ha,hb,fd),hr=-at(ha,hb,tr);
const action=(x,vertical)=>Math.abs(x)<1e-9?'Sem correção teórica':vertical?(x>0?'Adicionar':'Retirar')+' '+fmt(Math.abs(x),4)+' mm de calço':'Mover '+fmt(Math.abs(x),4)+' mm para '+(x>0?'direita':'esquerda');
v=`<div style="font-size:14px;line-height:1.9"><b>CORREÇÃO VERTICAL TEÓRICA</b><br>Pé próximo: ${action(vf,true)} (${fmt(vf/0.0254,3)} mils)<br>Pé distante: ${action(vr,true)} (${fmt(vr/0.0254,3)} mils)<br><b>CORREÇÃO HORIZONTAL TEÓRICA</b><br>Pé próximo: ${action(hf,false)} (${fmt(hf/0.0254,3)} mils)<br>Pé distante: ${action(hr,false)} (${fmt(hr/0.0254,3)} mils)<br><span style="font-size:12px">Offsets A/B vertical: ${fmt(va,4)} / ${fmt(vb,4)} mm; horizontal: ${fmt(ha,4)} / ${fmt(hb,4)} mm.</span></div>`;
window.alignmentSummary=`MecTools Pro — CENTAC / relógios reversos — TEÓRICO\nVertical pé próximo: ${action(vf,true)}\nVertical pé distante: ${action(vr,true)}\nHorizontal pé próximo: ${action(hf,false)}\nHorizontal pé distante: ${action(hr,false)}\nRequer verificação do procedimento OEM, sag, polaridades, metas térmicas e remedição.`;
break}
case 'microns':{ok=Number.isFinite(a)&&a>=0;v=$('unit').value==='um'?`${fmt(a/25.4,6)} mils`:`${fmt(a*25.4,6)} µm`;break}
case 'discharge':{
 const value=id=>{const el=$(id);if(!el||!el.value.trim())return null;const z=Number(el.value.replace(',','.'));return Number.isFinite(z)?z:NaN};
 const method=$('method').value,di=value('di'),vel=value('vel'),meter=value('meter'),mass=value('mass');
 const pd=value('pd'),td=value('td'),R=value('r'),ps=value('ps'),ts=value('ts');
 const inlet=value('inlet'),blow=value('blow'),amps=value('amps'),volts=value('volts'),pf=value('pf'),vent=value('vent');
 const errors=[];if(inlet!==null&&!(inlet>=0&&inlet<=100))errors.push('Inlet deve estar entre 0 e 100%.');if(blow!==null&&!(blow>=0&&blow<=100))errors.push('Blow-off deve estar entre 0 e 100%.');
 if(ps!==null&&ps<=0||pd!==null&&pd<=0)errors.push('Pressões absolutas devem ser maiores que zero.');if(ts!==null&&ts<=-273.15||td!==null&&td<=-273.15)errors.push('Temperatura abaixo do zero absoluto.');
 if(!(R>0))errors.push('Constante do gás R deve ser positiva.');if(pf!==null&&!(pf>0&&pf<=1))errors.push('Fator de potência deve estar entre 0 e 1.');
 let q=null,m=null,origin='';const rho=pd>0&&td!==null&&td>-273.15&&R>0?(pd*100000)/(R*(td+273.15)):null;
 if(method==='velocity'){if(!(di>0&&vel!==null&&vel>=0))errors.push('Informe diâmetro interno e velocidade média realmente medida.');else{q=Math.PI*(di/1000)**2/4*vel*3600;origin='Calculada de velocidade medida (m³/h reais na descarga)';}}
 if(method==='flowmeter'){if(!(meter!==null&&meter>=0))errors.push('Informe leitura do medidor em m³/h reais na descarga.');else{q=meter;origin='Leitura do medidor (m³/h reais na descarga)';}}
 if(method==='mass'){if(!(mass!==null&&mass>=0))errors.push('Informe vazão mássica medida em kg/h.');else{m=mass;origin='Vazão mássica medida';if(rho)q=m/rho;}}
 if(q!==null&&rho!==null)m=q*rho;
 if(vent!==null&&!(Number.isFinite(vent)&&vent>=0))errors.push('Vazão da blow-off não pode ser negativa.');
 if(vent!==null&&m!==null&&vent>m)errors.push('Blow-off medida maior que vazão do compressor: revise limites de medição.');
 if(errors.length){v='<b>Corrija os dados:</b><br>'+errors.join('<br>');break;}
 let parts=[`<span style="font-size:14px">${origin||'Diagnóstico sem medição de vazão'}</span>`];
 if(q!==null)parts.push(`${fmt(q,3)} m³/h reais na descarga`);
 if(rho!==null)parts.push(`Densidade ideal estimada: ${fmt(rho,4)} kg/m³`);
 if(m!==null)parts.push(`Vazão mássica: ${fmt(m,3)} kg/h`);
 if(m!==null&&vent!==null)parts.push(`Entrega líquida estimada: ${fmt(m-vent,3)} kg/h (se não houver outros ramais)`);
 if(amps!==null&&volts!==null&&pf!==null&&amps>=0&&volts>0)parts.push(`Potência elétrica trifásica estimada: ${fmt(Math.sqrt(3)*volts*amps*pf/1000,3)} kW (não determina vazão)`);
 parts.push(`<span style="font-size:13px">Inlet ${inlet===null?'não informada':fmt(inlet,1)+'%'}; blow-off ${blow===null?'não informada':fmt(blow,1)+'%'}. Posição de válvula não representa vazão proporcional.</span>`);
 if(method==='diagnostic')parts.push('<span style="font-size:13px">Sem medidor, velocidade média medida ou mapa OEM validado, não há vazão real calculável.</span>');
 if(q!==null&&rho===null)parts.push('<span style="font-size:13px">Para converter em kg/h e descontar blow-off, informe pressão e temperatura absolutas da descarga e propriedades do gás.</span>');
 v=parts.join('<br>');break}
case 'pressure':{ok=Number.isFinite(a);let f={psi:0.0689475729,bar:1,kpa:.01,mpa:10}[$('u').value],bar=a*f;v=`${fmt(bar,6)} bar · ${fmt(bar/0.0689475729,4)} PSI<br>${fmt(bar*100,4)} kPa · ${fmt(bar/10,5)} MPa`;break}
case 'inch':{const dir=$('inchdir').value,raw=$('a').value.trim();let x=frac(raw);ok=raw!==''&&Number.isFinite(x)&&x>=0;if(!ok){v='Informe uma medida válida. Exemplos: 4/5, 1 1/2, 0,875 ou 25,4. Denominador não pode ser zero.';break}if(dir==='in-mm'){v=`${fmt(x*25.4,6)} mm<br>${fmt(x*25400,3)} µm<br>${fmt(x*1000,5)} mils<br>${fmt(x,7)} polegadas decimais`;}else if(dir==='mm-in'){let inches=x/25.4;v=`${fmt(inches,8)} polegadas<br>Fração aproximada (1/128): ${nearestFraction(inches)} in<br>${fmt(x*1000,3)} µm · ${fmt(inches*1000,5)} mils`;}else{v=`${fmt(x*0.0254,7)} mm<br>${fmt(x*25.4,5)} µm<br>${fmt(x/1000,8)} polegadas`;}break}
case 'vibration':ok=Number.isFinite(a)&&Number.isFinite(b)&&b>0&&a>=0;{let um=a*1000*Math.SQRT2/(Math.PI*b);v=`${fmt(um,5)} µm p-p<br>${fmt(um/25.4,6)} mils p-p`;break}
case 'flow':ok=Number.isFinite(a)&&Number.isFinite(b)&&a>0&&b>=0;{let q=Math.PI*(a/1000)**2/4*b;v=`${fmt(q,6)} m³/s<br>${fmt(q*3600,3)} m³/h · ${fmt(q*60000,2)} L/min`;break}
case 'torque':ok=Number.isFinite(a);v=`${fmt(a*0.737562,4)} lbf·ft<br>${fmt(a/9.80665,4)} kgf·m`;break;
case 'loop':ok=[a,b,c].every(Number.isFinite)&&b>a&&c>=4&&c<=20;v=`${fmt(a+(c-4)/16*(b-a),5)} unidades de processo<br>${fmt((c-4)/16*100,2)}% da escala`;break;
case 'dial':ok=Number.isFinite(a);v=`${fmt(a*0.0254,6)} mm<br>${fmt(a*25.4,4)} µm · ${fmt(a*0.001,6)} in`;break;
case 'bore':ok=[a,b,c,d].every(Number.isFinite)&&a>0&&a+b>0;v=`Diâmetro calculado: ${fmt(a+b,5)} mm<br>Ovalização X–Y: ${fmt(Math.abs(c-d),5)} mm`;break;
case 'rpm':ok=Number.isFinite(a)&&a>=0;v=`${fmt(a*60,3)} RPM / CPM (1 evento por volta)`;break;
case 'thermal':ok=[a,b,c].every(Number.isFinite)&&a>0&&c>=0;v=`ΔL = ${fmt(a*b*c/1e6,6)} mm<br>Comprimento final: ${fmt(a+a*b*c/1e6,5)} mm`;break;
case 'surge':ok=Number.isFinite(a)&&Number.isFinite(b)&&a>0&&b>0;v=ok?`Separação relativa de vazões: ${fmt((a-b)/a*100,2)}% (denominador: vazão operacional). ${a<=b?'Ponto informado na linha ou à esquerda dela: consultar procedimento OEM.':'Ponto informado à direita da linha; confirmar a margem exigida no mapa e no controlador OEM.'}`:'Para calcular, informe as duas vazões corrigidas válidas do MESMO mapa OEM. Sem mapa, utilize o guia e o checklist acima.';break;
}
let o=$('answer');if(o)o.innerHTML=['alignment','inch','discharge','surge'].includes(current)?v:(ok&&Number.isFinite(a)?v:'Verifique os valores informados.')}
filterTools();
</script></body></html>
