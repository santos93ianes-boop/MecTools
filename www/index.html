<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1524"><title>MecTools Pro</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ff;background:#09111f}*{box-sizing:border-box}body{margin:0}header{padding:22px 18px;background:linear-gradient(135deg,#112e4d,#0b1627);border-bottom:1px solid #25405d}h1{font-size:25px;margin:0}small,.muted{color:#9fb5cf}.tag{color:#5ce0cc;font-size:12px;letter-spacing:2px;font-weight:700}main{max-width:740px;margin:auto;padding:16px 16px 60px}nav{display:flex;gap:8px;overflow:auto;padding:0 0 16px}button{cursor:pointer;border:1px solid #315271;border-radius:12px;padding:11px 14px;background:#17304a;color:#fff;font-weight:650}button.active{background:#00a995;color:#031b22;border-color:#00a995}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:#12253b;border:1px solid #26425f;padding:17px;border-radius:15px;text-align:left;min-height:100px}.tile b{display:block;margin:7px 0}.tile span{font-size:12px;color:#a3b8ce}.panel{background:#11243a;border:1px solid #294663;border-radius:17px;padding:18px;margin:12px 0}.panel h2{font-size:21px;margin:0 0 14px}.field{margin:13px 0}label{display:block;color:#b8cbe0;font-size:13px;margin-bottom:7px}input,select{background:#081a2b;border:1px solid #3a5873;color:white;width:100%;padding:13px;border-radius:10px;font-size:17px}output,.result{display:block;padding:16px;background:#073c41;color:#76f5d5;border-radius:12px;margin-top:16px;font-size:21px;font-weight:750;overflow-wrap:anywhere}.note{font-size:12px;color:#b4c6d8;line-height:1.6}.back{margin-bottom:12px}.hidden{display:none}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 7px;border-bottom:1px solid #34506a;text-align:left}svg{width:100%;height:auto;background:#0a1c30;border-radius:12px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}footer{color:#829ab5;text-align:center;font-size:12px;padding:25px}
</style></head><body><header><div class="tag">SANMAPPS • FERRAMENTAS INDUSTRIAIS</div><h1>⚙ MecTools Pro</h1><small>Cálculos, instrumentação e manutenção • Offline</small></header><main><section id="home"><div class="panel"><b>Qual ferramenta você precisa?</b><p class="muted">Selecione um módulo para calcular e consultar referências técnicas.</p><input id="search" placeholder="Buscar pressão, rosca, súbito..." oninput="filterTools()"></div><div id="tiles" class="grid"></div></section><section id="tool" class="hidden"><button class="back" onclick="home()">← Todas as ferramentas</button><div id="content"></div></section><footer>Resultados auxiliares • Confirme especificações e limites com o fabricante.</footer></main>
<script>
const modules=[
['alignment','Alinhamento CENTAC','2 relógios reversos, calços, motor','⊕'],['pressure','Pressão','PSI, bar, kPa, MPa','◉'],['inch','Polegadas','Frações, mm, µm','▤'],['vibration','Vibração','mm/s RMS, mils, µm','〰'],['flow','Vazão em tubos','Diâmetro e velocidade','◈'],['torque','Torque','N·m e lbf·ft','↻'],['loop','Instrumentação 4–20 mA','Sinal e escala','⌁'],['dial','Relógio comparador','Milésimos de polegada','◴'],['bore','Súbito','Diâmetro, ovalização','◎'],['surge','Curva de Surge','Mapa didático','⌁'],['threads','Roscas NPT e BSP','Tabelas e passo','≋'],['instruments','Instrumentos','Paquímetro, micrômetro e mais','▥'],['rpm','RPM e frequência','Hz, RPM, CPM','⟳'],['thermal','Dilatação térmica','Expansão linear','↔']
];
const $=id=>document.getElementById(id);
function filterTools(){let q=$('search').value.toLowerCase();$('tiles').innerHTML=modules.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<button class="tile" onclick="openTool('${x[0]}')"><div style="font-size:24px;color:#6ce3d1">${x[3]}</div><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}
function home(){$('tool').classList.add('hidden');$('home').classList.remove('hidden')}
function field(id,label,value,type='number'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${value}" oninput="calc()"></div>`}
function sel(id,label,opts){return `<div class="field"><label>${label}</label><select id="${id}" onchange="calc()">${opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`}
const out=()=>'<output id="answer">Preencha os dados.</output>';
const n=id=>Number(($(id)?.value||'').replace(',','.'));
const fmt=(v,d=4)=>Number.isFinite(v)?v.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
function frac(s){s=s.trim().replace(',','.');let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+(+m[2]/+m[3]);let p=s.split('/');return p.length===2?+p[0]/+p[1]:+s}
let current='';
function openTool(id){current=id;$('home').classList.add('hidden');$('tool').classList.remove('hidden');let name=modules.find(x=>x[0]===id)[1],body='';
switch(id){
case 'alignment':body=`<p class="note"><b>Montagem conforme esquema CENTAC fornecido:</b> dois relógios reversos. Relógio inferior com suporte no lado compressor, apalpando cubo do motor; relógio superior com suporte no lado motor, apalpando cubo do compressor. Confirme fisicamente a posição dos planos e a orientação dos apalpadores antes de utilizar qualquer resultado.</p>
<svg viewBox="0 0 350 180" role="img" aria-label="Esquema didático do motor à esquerda e compressor à direita com relógio inferior à esquerda e superior à direita"><rect x="8" y="63" width="100" height="53" rx="7" fill="#174663" stroke="#75a8c5"/><text x="31" y="86" fill="white" font-size="12">MOTOR</text><text x="23" y="101" fill="#afcde0" font-size="10">MÓVEL</text><rect x="239" y="63" width="103" height="53" rx="7" fill="#174663" stroke="#75a8c5"/><text x="249" y="86" fill="white" font-size="11">COMPRESSOR</text><text x="263" y="101" fill="#afcde0" font-size="10">FIXO</text><path d="M108 90 H239" stroke="#65dfc7" stroke-width="6"/><rect x="155" y="73" width="37" height="34" rx="4" fill="#8296aa"/><path d="M96 128 H210 V40 H195" fill="none" stroke="#e4b864" stroke-width="3"/><path d="M250 43 H142 V138 H158" fill="none" stroke="#78bdf3" stroke-width="3"/><circle cx="195" cy="40" r="12" fill="#12253b" stroke="#e4b864" stroke-width="3"/><circle cx="158" cy="138" r="12" fill="#12253b" stroke="#78bdf3" stroke-width="3"/><text x="211" y="28" fill="#e4b864" font-size="10">Superior (B)</text><text x="15" y="161" fill="#78bdf3" font-size="10">Inferior (A)</text><text x="13" y="175" fill="#afcde0" font-size="9">Esquema conceitual — não representa suporte real em escala</text></svg>
<h3>1. Distâncias axiais (mm)</h3><p class="note">Referência axial: plano A = 0; sentido positivo do motor para o compressor. Informe as coordenadas medidas no equipamento. A posição dos pés pode ser negativa.</p>
${field('ab','Plano B em relação ao plano A (mm)', '', 'text')}${field('af','Coordenada do pé do motor próximo ao acoplamento (mm)', '', 'text')}${field('ar','Coordenada do pé do motor distante do acoplamento (mm)', '', 'text')}
<h3>2. Leituras do relógio inferior — plano A</h3><p class="note">Insira os valores na unidade selecionada na etapa 5 (mm ou mils).</p>${field('at','12h (topo), mm','','text')}${field('abottom','6h (embaixo), mm','','text')}${field('al','9h (esquerda), mm','','text')}${field('aright','3h (direita), mm','','text')}
<h3>3. Leituras do relógio superior — plano B</h3><p class="note">Insira os valores na mesma unidade do relógio inferior.</p>${field('bt','12h (topo), mm','','text')}${field('bbottom','6h (embaixo), mm','','text')}${field('bl','9h (esquerda), mm','','text')}${field('bright','3h (direita), mm','','text')}
<h3>4. Correção de flexão do suporte (sag)</h3><p class="note">Insira a correção diferencial vertical (leitura 6h menos 12h) determinada no teste de sag, com sinal e na mesma unidade; não é um deslocamento de eixo.</p>
${field('saga','Sag diferencial do relógio inferior A (mesma unidade das leituras)',0)}${field('sagb','Sag diferencial do relógio superior B (mesma unidade das leituras)',0)}
<h3>5. Convenções verificadas</h3>${sel('unit','Unidade das leituras',[['mm','mm'],['mil','mils (0,001 in)']])}${sel('mapping','Relação física do relógio e eixo',[['','Selecione após confirmar em campo'],['verified','Montagem reversa e orientação confirmadas']])}${sel('polA','Sinal físico do relógio A',[['','Selecione polaridade A'],['1','Leitura diferencial positiva = posição positiva'],['-1','Leitura diferencial positiva = posição negativa']])}${sel('polB','Sinal físico do relógio B',[['','Selecione polaridade B'],['1','Leitura diferencial positiva = posição positiva'],['-1','Leitura diferencial positiva = posição negativa']])}
<p class="note">Convenção de referência: vertical positivo = acima; horizontal positivo = à direita olhando do motor para o compressor. Para relógios reversos com apalpadores em sentidos opostos, a polaridade de cada relógio pode diferir. Verifique com deslocamento controlado e procedimento OEM. Os valores são calculados por interpolação/extrapolação geométrica; não incluem crescimento térmico nem compensação de metas a quente.</p>
${out()}<button onclick="copyAlignment()">Copiar resultado</button><p class="note"><b>Protótipo de cálculo, não validado:</b> a orientação do esquema enviado não determina, por si só, o sinal das leituras. Sem confirmação de montagem, sag e geometria, não execute correções em campo. Conferir pé manco, condição térmica, tolerâncias OEM e repetir medição após qualquer ajuste.</p>`;break;
case 'pressure':body=field('a','Pressão',100)+sel('u','Unidade de entrada',[['psi','PSI'],['bar','bar'],['kpa','kPa'],['mpa','MPa']])+out();break;
case 'inch':body=field('a','Polegada (ex.: 1/4 ou 1 1/2)','1/4','text')+out();break;
case 'vibration':body=field('a','Velocidade RMS (mm/s)',0.82)+field('b','Frequência da vibração (Hz)',60)+out()+'<p class="note">A conversão só é válida para vibração senoidal de uma frequência. RMS de velocidade e deslocamento pico a pico não são unidades diretamente intercambiáveis.</p>';break;
case 'flow':body=field('a','Diâmetro INTERNO (mm)',100)+field('b','Velocidade média (m/s)',10)+out()+'<p class="note">Q = A × v. Para dimensionar válvulas e vazão de gás compressível, são necessários outros parâmetros (pressões, temperatura, composição, coeficiente da válvula e condição de escoamento).</p>';break;
case 'torque':body=field('a','Torque (N·m)',100)+out();break;
case 'loop':body=field('a','Limite inferior da escala',0)+field('b','Limite superior da escala',10)+field('c','Corrente medida (mA)',12)+out();break;
case 'dial':body=field('a','Leitura em mils (0,001 polegada)',1)+out()+'<p class="note">1 mil = 0,001 in = 0,0254 mm = 25,4 µm. Observe a resolução e o sentido do relógio real.</p>';break;
case 'bore':body=field('a','Diâmetro de referência (mm)',100)+field('b','Desvio indicado com sinal (mm)',0.025)+field('c','Medida no eixo X (mm)',100.025)+field('d','Medida no eixo Y (mm)',99.99)+out()+'<p class="note">O sinal do desvio depende da convenção de ajuste do comparador. Faça a zeragem em padrão conhecido antes de medir.</p>';break;
case 'rpm':body=field('a','Frequência (Hz)',60)+out();break;
case 'thermal':body=field('a','Comprimento inicial (mm)',1000)+field('b','Variação de temperatura (°C)',50)+field('c','Coeficiente de dilatação (×10⁻⁶/°C)',12)+out();break;
case 'surge':body=field('a','Vazão corrigida de operação (unidade relativa)',70)+field('b','Vazão na linha de surge para mesma condição (unidade relativa)',55)+`<svg viewBox="0 0 340 205" aria-label="Curva didática"><line x1="35" y1="15" x2="35" y2="177" stroke="#aec6d9"/><line x1="35" y1="177" x2="328" y2="177" stroke="#aec6d9"/><path d="M45 154 Q80 48 133 43 T325 93" stroke="#36a5f4" stroke-width="3" fill="none"/><path d="M120 175 Q117 94 133 43" stroke="#ff7777" stroke-width="3" fill="none" stroke-dasharray="5 4"/><circle id="dot" cx="215" cy="73" r="7" fill="#65f5c5"/><text x="43" y="18" fill="#b8ccdd" font-size="10">Razão de pressão</text><text x="195" y="195" fill="#b8ccdd" font-size="10">Vazão corrigida →</text><text x="80" y="36" fill="#ff7777" font-size="11">Surge</text></svg>`+out()+'<p class="note"><b>SIMULAÇÃO DIDÁTICA.</b> Gráfico esquemático, sem curva real de fabricante. A margem apresentada é apenas (Qop−Qsurge)/Qop ×100. Para operar ou configurar proteção antissurge, use mapa OEM, correções de gás, rotação, pressões, temperaturas e estratégia validada de controle.</p>';break;
case 'threads':body=`<p class="note">Roscas de tubulação têm diâmetro externo diferente do tamanho nominal. BSPP = paralela; BSPT e NPT = cônicas. Não são intercambiáveis sem avaliação técnica.</p><table><tr><th>Nominal</th><th>NPT TPI</th><th>BSP TPI</th><th>OD NPT (mm aprox.)</th><th>OD BSP (mm aprox.)</th></tr>${[['1/8',27,28,10.29,9.73],['1/4',18,19,13.72,13.16],['3/8',18,19,17.15,16.66],['1/2',14,14,21.34,20.96],['3/4',14,14,26.67,26.44],['1',11.5,11,33.40,33.25]].map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</table><p class="note">Tabela resumida de consulta. Confirme normas ASME B1.20.1 e ISO 7 / ISO 228, tolerâncias e calibres antes da fabricação.</p>`;break;
case 'instruments':body=`<p>Guia rápido de instrumentos de medição:</p><table><tr><th>Instrumento</th><th>Aplicação / cuidado</th></tr>${[['Paquímetro','Diâmetro externo/interno, profundidade; verificar zero e resolução do nônio.'],['Micrômetro','Medições precisas; usar catraca e padrão de verificação.'],['Súbito','Diâmetros internos; zerar por anel ou micrômetro de referência.'],['Relógio comparador','Batimento radial/axial, deslocamento relativo e alinhamento.'],['Relógio apalpador','Batimento em pontos de acesso limitado.'],['Calibrador de folgas','Folgas entre superfícies; evitar força excessiva.'],['Rugosímetro','Rugosidade superficial; definir parâmetro e comprimento de avaliação.'],['Manômetro','Pressão; conferir escala e classe de exatidão.'],['Calibrador de loop','Sinal 4–20 mA; conferir alimentação e modo fonte/simulador.']].map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</table><p class="note">Para registrar medições, anote instrumento, identificação, certificado de calibração, resolução, temperatura, valor, tolerância e incerteza.</p>`;break;
}
$('content').innerHTML=`<div class="panel"><h2>${name}</h2>${body}</div>`;calc()}
function copyAlignment(){if(window.alignmentSummary){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(window.alignmentSummary).catch(()=>prompt('Copie o resultado:',window.alignmentSummary))}else{prompt('Copie o resultado:',window.alignmentSummary)}}}
function calc(){let a=n('a'),b=n('b'),c=n('c'),d=n('d'),v='',ok=true;if(['threads','instruments'].includes(current))return;
switch(current){
case 'alignment':{
const ids=['ab','af','ar','at','abottom','al','aright','bt','bbottom','bl','bright','saga','sagb'];
const filled=ids.every(id=>$(id)&&$(id).value.trim()!==''), ab=n('ab'), fd=n('af'), tr=n('ar');
const verified=$('mapping').value==='verified'&&$('polA').value!==''&&$('polB').value!=='';
const unit=$('unit').value==='mil'?0.0254:1;
const pA=Number($('polA').value),pB=Number($('polB').value);
ok=filled&&verified&&ab!==0&&fd!==tr&&[ab,fd,tr,...ids.map(n)].every(Number.isFinite);
if(!ok){v='Preencha todas as leituras e distâncias, confirme a montagem e selecione as polaridades físicas dos dois relógios. Sem isso, o cálculo permanece bloqueado.';window.alignmentSummary='';break;}
const va=((n('abottom')-n('at')-n('saga'))/2)*pA*unit;
const vb=((n('bbottom')-n('bt')-n('sagb'))/2)*pB*unit;
const ha=((n('aright')-n('al'))/2)*pA*unit;
const hb=((n('bright')-n('bl'))/2)*pB*unit;
const at=(x1,x2,x)=>x1+(x2-x1)*x/ab;
const vf=-at(va,vb,fd),vr=-at(va,vb,tr),hf=-at(ha,hb,fd),hr=-at(ha,hb,tr);
const action=(x,vertical)=>Math.abs(x)<1e-9?'Sem correção teórica':vertical?(x>0?'Adicionar':'Retirar')+' '+fmt(Math.abs(x),4)+' mm de calço':'Mover '+fmt(Math.abs(x),4)+' mm para '+(x>0?'direita':'esquerda');
v=`<div style="font-size:14px;line-height:1.9"><b>CORREÇÃO VERTICAL TEÓRICA</b><br>Pé próximo: ${action(vf,true)} (${fmt(vf/0.0254,3)} mils)<br>Pé distante: ${action(vr,true)} (${fmt(vr/0.0254,3)} mils)<br><b>CORREÇÃO HORIZONTAL TEÓRICA</b><br>Pé próximo: ${action(hf,false)} (${fmt(hf/0.0254,3)} mils)<br>Pé distante: ${action(hr,false)} (${fmt(hr/0.0254,3)} mils)<br><span style="font-size:12px">Offsets A/B vertical: ${fmt(va,4)} / ${fmt(vb,4)} mm; horizontal: ${fmt(ha,4)} / ${fmt(hb,4)} mm.</span></div>`;
window.alignmentSummary=`MecTools Pro — CENTAC / relógios reversos — TEÓRICO\nVertical pé próximo: ${action(vf,true)}\nVertical pé distante: ${action(vr,true)}\nHorizontal pé próximo: ${action(hf,false)}\nHorizontal pé distante: ${action(hr,false)}\nRequer verificação do procedimento OEM, sag, polaridades, metas térmicas e remedição.`;
break}
case 'pressure':{let f={psi:0.0689475729,bar:1,kpa:.01,mpa:10}[$('u').value],bar=a*f;v=`${fmt(bar,6)} bar · ${fmt(bar/0.0689475729,4)} PSI<br>${fmt(bar*100,4)} kPa · ${fmt(bar/10,5)} MPa`;break}
case 'inch':{let x=frac($('a').value);ok=Number.isFinite(x);v=`${fmt(x*25.4,6)} mm · ${fmt(x*25400,3)} µm`;break}
case 'vibration':ok=b>0&&a>=0;{let um=a*1000*Math.SQRT2/(Math.PI*b);v=`${fmt(um,5)} µm p-p<br>${fmt(um/25.4,6)} mils p-p`;break}
case 'flow':ok=a>0&&b>=0;{let q=Math.PI*(a/1000)**2/4*b;v=`${fmt(q,6)} m³/s<br>${fmt(q*3600,3)} m³/h · ${fmt(q*60000,2)} L/min`;break}
case 'torque':v=`${fmt(a*0.737562,4)} lbf·ft<br>${fmt(a/9.80665,4)} kgf·m`;break;
case 'loop':ok=b>a&&c>=4&&c<=20;v=`${fmt(a+(c-4)/16*(b-a),5)} unidades de processo<br>${fmt((c-4)/16*100,2)}% da escala`;break;
case 'dial':v=`${fmt(a*0.0254,6)} mm<br>${fmt(a*25.4,4)} µm · ${fmt(a*0.001,6)} in`;break;
case 'bore':v=`Diâmetro calculado: ${fmt(a+b,5)} mm<br>Ovalização X–Y: ${fmt(Math.abs(c-d),5)} mm`;break;
case 'rpm':v=`${fmt(a*60,3)} RPM / CPM (1 evento por volta)`;break;
case 'thermal':v=`ΔL = ${fmt(a*b*c/1e6,6)} mm<br>Comprimento final: ${fmt(a+a*b*c/1e6,5)} mm`;break;
case 'surge':ok=a>0&&b>0;v=`Margem ilustrativa: ${fmt((a-b)/a*100,2)}% · ${a<=b?'Ponto na região de surge ilustrativa':'Ponto à direita da linha ilustrativa'}`;let dot=$('dot');if(dot)dot.setAttribute('cx',Math.max(45,Math.min(325,35+a*2.5)));break;
}
let o=$('answer');if(o)o.innerHTML=current==='alignment'?v:(ok&&Number.isFinite(a)?v:'Verifique os valores informados.')}
filterTools();
</script></body></html>
